# 每次推送和 PR 都建置並執行測試（execution-plan.md 5.10）。
#
# CI 用 `ci` 這組 preset：產生器是 Ninja Multi-Config，不綁 Visual Studio 版本
# （執行環境的版本和開發機不一定相同）。整合測試需要桌面環境，不在 CI 執行。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: 程式碼格式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 固定版本：不同版本的 clang-format 排出來的結果會不一樣
      - run: pip install clang-format==19.1.7
      - name: clang-format
        run: |
          files=$(git ls-files '*.cpp' '*.h' ':!:third_party/*')
          clang-format --version
          clang-format --dry-run --Werror $files

  build:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            configure: ci
            build: ci-debug
            test: ci-debug
          - name: Release
            configure: ci
            build: ci-release
            test: ci-release
          - name: AddressSanitizer
            configure: ci-asan
            build: ci-asan
            test: ci-asan
    steps:
      - uses: actions/checkout@v5

      # tools/ 的 Python 測試會和單元測試一起由 ctest 執行（需要 3.10 以上）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 設定 cl.exe 的環境（Ninja 需要）。固定版本：v1.13.0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      # Qt 的官方預編譯版（qtbase 約 39 MB，解壓後約 290 MB），版本固定在 cmake/Qt.cmake
      - name: 快取 Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: .cache/qt
          key: qt-6.9.3-win64_msvc2022_64-qtbase

      - name: 安裝 Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pip install aqtinstall==3.3.0
          aqt install-qt windows desktop 6.9.3 win64_msvc2022_64 --archives qtbase --outputdir .cache/qt

      # ONNX Runtime 和 DirectML 的 NuGet 套件，版本固定在 cmake/OnnxRuntime.cmake
      - name: 快取下載的套件
        uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: downloads-${{ hashFiles('cmake/OnnxRuntime.cmake') }}

      # vcpkg 的建置結果（OpenCV 要從原始碼建置，第一次很久）
      - name: 快取 vcpkg 的建置結果
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-
            vcpkg-

      - name: 設定
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset ${{ matrix.configure }}

      # 失敗時把編譯器的錯誤行輸出成 GitHub 的「註解」。註解不需要倉庫管理權限就看得到，
      # 完整的執行日誌則需要，所以光看日誌連結不夠。
      - name: 建置
        run: |
          cmake --build --preset ${{ matrix.build }} 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path build.log -Pattern ': (error|fatal error) ' |
              Select-Object -First 20 |
              ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
          }
          exit $code

      - name: 單元測試
        run: ctest --preset ${{ matrix.test }}
